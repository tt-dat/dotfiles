

#" GENERAL {{{

# reload config file
bind r \
	 source-file ~/.tmux.conf \; \
	 display-message "Configuration reloaded"


# time for using command without Prefix after the first command (in miliseconds)
# reset when a command is sent during this time interval
set -g repeat-time 1000


# Default using some vi keys in command mode
set status-keys vi

#" }}}

#" SESSION  {{{
bind C new-session
#" }}}

#" WINDOW {{{

# set the base index for windows to 1 instead of 0
# g stand for global, means that it applies to all sessions
set -g base-index 1


# using repeatable navigating through windows
unbind n
unbind p
bind -r n select-window -t :+
bind -r p select-window -t :-

# kill current window
bind-key X confirm-before -p 'kill-window? (y/n)' kill-window

#" }}}

#" PANE {{{
# smart pane switching with awareness of vim splits

vim_pattern='(\s+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqe '^[^txz ]+ +${vim_pattern}$'"

bind -n 'c-h' if-shell "$is_vim" 'send-keys c-h' 'select-pane -L'
bind -n 'c-j' if-shell "$is_vim" 'send-keys c-j' 'select-pane -D'
bind -n 'c-k' if-shell "$is_vim" 'send-keys c-k' 'select-pane -U'
bind -n 'c-l' if-shell "$is_vim" 'send-keys c-l' 'select-pane -R'


bind -T copy-mode-vi 'c-h' select-pane -L
bind -T copy-mode-vi 'c-j' select-pane -D
bind -T copy-mode-vi 'c-k' select-pane -U
bind -T copy-mode-vi 'c-l' select-pane -R

# set the base index for pane to 1
# w stand for window
set -w -g pane-base-index 1 

# break pane to new window
bind-key b break-pane -a

# more resonable pane creation
unbind '"'
unbind %

bind / split-window -h
bind - split-window -v


# resize panes
bind -r c-h resize-pane -L 5
bind -r c-l resize-pane -R 5
bind -r c-k resize-pane -U 5
bind -r c-j resize-pane -D 5

# swap pane
bind-key -r h swap-pane -s '{left-of}'
bind-key -r l swap-pane -s '{right-of}'
bind-key -r j swap-pane -s '{down-of}'
bind-key -r k swap-pane -s '{up-of}'


#" }}}
#" FLOATING_SESSION {{{
	
	# Prefix + f to show/hide floating note
	unbind-key f

	bind-key f if-shell -F '#{==:#{session_name},floating_session}' {
		detach-client 
	} {
		display-popup -E -w 50% -h 50% -T "floating_session" \
		"tmux attach-session -t 'floating_session' || tmux new-session -s 'floating_session'"
	}
#" }}}

#" COPY_MODE {{{

	# using vi-like visual mode for copy mode
	set-window-option -g mode-keys vi
	unbind -T copy-mode-vi 'v'
	bind -T copy-mode-vi 'v' send-keys -X begin-selection
	bind -T copy-mode-vi 'V' send-keys -X select-line
	# turn visual-block mode on/off
	bind -T copy-mode-vi 'C-v' send-keys -X rectangle-toggle
	bind -T copy-mode-vi 'y' send-keys -X copy-selection-and-cancel


	
#" }}}

#" PASTE_BUFFER {{{
	# open buffer list
	bind-key '"' choose-buffer -Z
#" }}}



#" CUSTOMIZE LOOKS OF TMUX {{{

# default status on
set-option status on

# turn status bar on or off
unbind-key ,
unbind-key .

bind-key , set-option status on
bind-key . set-option status off

# customize status line
set -g status-style fg=black,bg=green
set -g window-status-current-style fg=black,bg=white


# Colors for pane borders
set -w -g pane-border-style fg=white,bg=black
set -w -g pane-active-border-style fg=green,bg=black

# Status line right side: Bat | 08:44 13-Sep
set -g status-right "Bat:#(cat /sys/class/power_supply/BAT1/capacity)% | %R %b-%d"

# Refresh the status line every minute
set -g status-interval 60

# Enable activity alerts
set -w -g monitor-activity on
set -w -g visual-activity off

#" }}}

